name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Static generate for GitHub Pages (no Nitro runtime on Pages).
      # NUXT_APP_BASE_URL must match the repo Pages path (e.g. /molecula-nuxt/).
      - run: npm run generate
        env:
          NUXT_APP_BASE_URL: /molecula-nuxt/
          NUXT_PUBLIC_WP_API_BASE: https://api.weblaba.ru/wp-json
          NUXT_PUBLIC_SITE_URL: https://proto0654.github.io/molecula-nuxt
          NUXT_PUBLIC_INDEXABLE: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
