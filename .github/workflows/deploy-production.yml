name: Production · weblaba.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

run-name: Production — weblaba.ru (${{ github.sha }})

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_SITE_URL: https://weblaba.ru
          NUXT_PUBLIC_WP_API_BASE: https://api.weblaba.ru/wp-json
          NUXT_PUBLIC_INDEXABLE: true

      - name: Load SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy via rsync
        run: |
          rsync -avzr --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            .output/public/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
